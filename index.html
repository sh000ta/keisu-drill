<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>計数管理マスタードリル（実戦編）</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .streak-box { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { font-size: 1.2em; color: #2c3e50; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        
        /* 設定・テストモード */
        .settings-area { margin-bottom: 15px; }
        select { width: 100%; padding: 12px; font-size: 1em; border: 1px solid #bdc3c7; border-radius: 8px; margin-bottom: 10px; background-color: #f9f9f9; }
        .btn-start { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .btn-start:active { background: #2980b9; }

        /* 問題エリア */
        #game-area { display: none; }
        .question-header { display: flex; justify-content: space-between; align-items: baseline; }
        .question-num { font-size: 0.9em; color: #7f8c8d; font-weight: bold; }
        .question-text { font-size: 1.05em; line-height: 1.6; margin-bottom: 15px; }
        
        /* ヒントエリア */
        .btn-hint { background: #f39c12; color: white; border: none; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; }
        .btn-hint:active { background: #d68910; }
        .hint-box { background: #fef9e7; border-left: 4px solid #f39c12; padding: 10px; margin-bottom: 15px; font-size: 0.95em; color: #d35400; display: none; }

        /* 電卓エリア */
        .calculator-container { background: #34495e; border-radius: 12px; padding: 15px; }
        .calc-display { display: flex; align-items: center; background: #fff; border-radius: 8px; margin-bottom: 10px; padding: 0 10px; }
        .calc-display input { flex: 1; border: none; background: transparent; font-size: 1.5em; text-align: right; padding: 10px 0; outline: none; color: #2c3e50; font-family: monospace; }
        
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { background: #ecf0f1; border: none; border-radius: 8px; font-size: 1.3em; padding: 15px 0; color: #2c3e50; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .calc-btn:active { background: #bdc3c7; }
        .calc-btn.op { background: #95a5a6; color: white; }
        .calc-btn.op:active { background: #7f8c8d; }
        .calc-btn.action { background: #e67e22; color: white; }
        .calc-btn.action:active { background: #d35400; }
        .calc-btn.backspace { background: #e74c3c; color: white; }
        .calc-btn.backspace:active { background: #c0392b; }
        .calc-btn.submit { grid-column: span 4; background: #27ae60; color: white; margin-top: 5px; }
        .calc-btn.submit:active { background: #2ecc71; }

        /* 結果・解説エリア */
        #result-area { display: none; margin-top: 15px; padding: 15px; border-radius: 8px; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .explanation { font-size: 0.95em; line-height: 1.5; margin-top: 10px; white-space: pre-wrap; }
        
        .btn-next { width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .btn-next:active { background: #1a252f; }

        /* テスト結果画面 */
        #test-result-area { display: none; text-align: center; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: #3498db; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(52,152,219,0.3); }
        .score-circle .score-num { font-size: 3em; font-weight: bold; line-height: 1; }
        .score-circle .score-text { font-size: 1em; }
        .test-feedback { font-size: 1.1em; font-weight: bold; margin-bottom: 20px; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="header-area">
        <div style="font-weight:bold; color:#2c3e50;">📊 計数管理 実戦ドリル</div>
        <div class="streak-box" id="streak-display">連続正解: 0</div>
    </div>

    <!-- 設定画面 -->
    <div class="card settings-area" id="settings-area">
        <h1>モード選択</h1>
        <p style="font-size:0.9em; color:#555;">実務に近い文章問題や引っかけ問題が出題されます。</p>
        <select id="mode-select">
            <option value="infinite">通常練習（エンドレス）</option>
            <option value="10">テストモード（10問）</option>
            <option value="20">テストモード（20問）</option>
            <option value="30">テストモード（30問）</option>
        </select>
        <button class="btn-start" onclick="startDrill()">ドリルを開始する</button>
    </div>

    <!-- 問題・解答画面 -->
    <div id="game-area">
        <div class="card">
            <div class="question-header">
                <h1>問題</h1>
                <span class="question-num" id="q-counter"></span>
            </div>
            <div class="question-text" id="question-text">
                ここに問題が表示されます。
            </div>
            
            <!-- ヒントエリア追加 -->
            <button class="btn-hint" id="btn-hint" onclick="showHint()">💡 ヒントを見る</button>
            <div class="hint-box" id="hint-box"></div>
            
            <div id="result-area">
                <strong id="judge-text"></strong>
                <div class="explanation" id="explanation-text"></div>
                <button class="btn-next" id="btn-next" onclick="nextQuestion()">次の問題へ</button>
            </div>
        </div>

        <div class="calculator-container" id="calculator-area">
            <div class="calc-display">
                <!-- inputmode="none" でスマホのキーボード出現を防ぎつつカーソル移動を可能に -->
                <input type="text" id="calc-input" inputmode="none" placeholder="数値を入力" onfocus="this.select();">
            </div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="calcAppend('7')">7</button>
                <button class="calc-btn" onclick="calcAppend('8')">8</button>
                <button class="calc-btn" onclick="calcAppend('9')">9</button>
                <button class="calc-btn op" onclick="calcAppend('/')">÷</button>
                
                <button class="calc-btn" onclick="calcAppend('4')">4</button>
                <button class="calc-btn" onclick="calcAppend('5')">5</button>
                <button class="calc-btn" onclick="calcAppend('6')">6</button>
                <button class="calc-btn op" onclick="calcAppend('*')">×</button>
                
                <button class="calc-btn" onclick="calcAppend('1')">1</button>
                <button class="calc-btn" onclick="calcAppend('2')">2</button>
                <button class="calc-btn" onclick="calcAppend('3')">3</button>
                <button class="calc-btn op" onclick="calcAppend('-')">-</button>
                
                <button class="calc-btn" onclick="calcAppend('0')">0</button>
                <button class="calc-btn" onclick="calcAppend('.')">.</button>
                <button class="calc-btn backspace" onclick="calcBackspace()">⌫</button>
                <button class="calc-btn op" onclick="calcAppend('+')">+</button>
                
                <button class="calc-btn action" style="grid-column: span 2;" onclick="calcClear()">クリア</button>
                <button class="calc-btn action" style="grid-column: span 2;" onclick="calcEval()">＝</button>
                
                <button class="calc-btn submit" onclick="checkAnswer()">解答する</button>
            </div>
        </div>
    </div>

    <!-- テスト結果画面 -->
    <div class="card" id="test-result-area">
        <h1>テスト完了！</h1>
        <div class="score-circle">
            <div class="score-num" id="score-num">80</div>
            <div class="score-text">点</div>
        </div>
        <div class="test-feedback" id="test-feedback">素晴らしい成績です！</div>
        <p style="color:#7f8c8d; font-size:0.9em; margin-bottom:20px;">
            正解数: <span id="correct-count-display"></span> / <span id="total-count-display"></span>問
        </p>
        <button class="btn-start" onclick="returnToMenu()">メニューに戻る</button>
    </div>

    <script>
        // --- 状態管理 ---
        let currentAnswer = 0;
        let streak = 0;
        
        let isTestMode = false;
        let totalQuestions = 0;
        let currentQuestionNum = 0;
        let correctCount = 0;
        let currentHintText = "";

        // --- ユーティリティ ---
        function getRnd(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function fmt(num) {
            return num.toLocaleString();
        }
        function getTrickText() {
            const tricks = [
                "部下から「今月は客数が昨対105%と好調です！」と報告がありましたが、",
                "早番スタッフの残業時間が前月より10時間減少していますが、",
                "ちょうど競合店の特売チラシが入った週でしたが、",
                "ちなみに昨年の同月のロス高は50,000円でしたが、",
                "レジの釣銭エラーが今月は3回発生していましたが、",
                "月末は雨天続きで客足が少し鈍ったものの、",
                "店舗の売上面積は250坪、従業員数は12名ですが、"
            ];
            return tricks[Math.floor(Math.random() * tricks.length)];
        }

        // --- 問題生成ロジック ---
        const questionGenerators = [
            function genAdvancedLoss() {
                let beg = getRnd(100, 300) * 10000;
                let pur = getRnd(500, 1000) * 10000;
                let sal = getRnd(500, 900) * 10000;
                let book = beg + pur - sal;
                let loss = getRnd(1, 10) * 10000;
                let act = book - loss;
                
                let text = `当月の期首在庫は${fmt(beg)}円、当期仕入額(売価)は${fmt(pur)}円、売上高は${fmt(sal)}円でした。\n\n${getTrickText()}月末に実地棚卸を行ったところ、実際の在庫(実地在庫)は${fmt(act)}円でした。\n\nこの時の「不明ロス高」はいくらでしょうか？（単位：円）`;
                let ans = loss;
                let exp = `【計算手順】\n①まず帳簿上の正しい在庫(あるべき在庫)を出します。\n期首在庫 ＋ 当期仕入 － 売上高\n${fmt(beg)} ＋ ${fmt(pur)} － ${fmt(sal)} ＝ ${fmt(book)}円\n\n②帳簿在庫から実地在庫を引いてロスを出します。\n${fmt(book)} － ${fmt(act)} ＝ ${fmt(ans)}円\n\n※部下の報告や天候などの情報は計算に関係のない引っかけです。`;
                let hint = `【ヒント】\nまずは「期首在庫 ＋ 当期仕入 － 売上高」で帳簿在庫（あるべき在庫）を出しましょう。部下の報告などの情報は計算に不要な引っかけです！`;
                return { text, ans, exp, hint };
            },
            function genAdvancedTurnover() {
                let beg = getRnd(200, 400) * 10000;
                let end = getRnd(200, 400) * 10000;
                let avg = (beg + end) / 2;
                let rate = getRnd(3, 8);
                let sal = avg * rate;
                
                let text = `年間の売上高は${fmt(sal)}円でした。\n\n${getTrickText()}期首在庫は${fmt(beg)}円、期末在庫は${fmt(end)}円となっています。\n\nこの部門の「商品回転率」は何回転でしょうか？（小数点以下第2位を四捨五入して第1位まで解答）`;
                let ans = Math.round((sal / avg) * 10) / 10;
                let exp = `【計算手順】\n①まず平均在庫を出します。\n(期首在庫 ＋ 期末在庫) ÷ 2\n(${fmt(beg)} ＋ ${fmt(end)}) ÷ 2 ＝ ${fmt(avg)}円\n\n②売上高を平均在庫で割ります。\n売上高 ÷ 平均在庫\n${fmt(sal)} ÷ ${fmt(avg)} ＝ ${ans}回転`;
                let hint = `【ヒント】\nいきなり割らずに、まずは「(期首在庫 ＋ 期末在庫) ÷ 2」で『平均在庫』を求めるのがポイントです。`;
                return { text, ans, exp, hint };
            },
            function genCrossRatio() {
                let marginRatio = getRnd(15, 35);
                let turnRate = getRnd(20, 60) / 10;
                
                let text = `部門会議にて。\n\n${getTrickText()}担当部門の「荒利益率」は${marginRatio}％、「商品回転率」は${turnRate}回転でした。\n\nこの部門の「交差比率」はいくつでしょうか？（小数点以下を四捨五入して整数で解答）`;
                let ans = Math.round(marginRatio * turnRate);
                let exp = `【計算手順】\n交差比率 ＝ 荒利益率(%) × 商品回転率(回転)\n${marginRatio} × ${turnRate} ＝ ${ans}\n\n※交差比率は「在庫投資に対してどれだけ粗利を稼いだか」を示す重要な指標です。`;
                let hint = `【ヒント】\n基本公式を思い出してください。「交差比率 ＝ 荒利益率(%) × 商品回転率(回転)」です！そのまま掛け算しましょう。`;
                return { text, ans, exp, hint };
            },
            function genCostOfSales() {
                let beg = getRnd(100, 200) * 10000;
                let pur = getRnd(400, 800) * 10000;
                let end = getRnd(100, 250) * 10000;
                
                let text = `今期の原価データを確認しています。\n\n${getTrickText()}期首商品棚卸高は${fmt(beg)}円、当期商品仕入高は${fmt(pur)}円、期末商品棚卸高は${fmt(end)}円でした。\n\nこの時の「売上原価」はいくらでしょうか？（単位：円）`;
                let ans = beg + pur - end;
                let exp = `【計算手順】\n売上原価 ＝ 期首商品棚卸高 ＋ 当期商品仕入高 － 期末商品棚卸高\n${fmt(beg)} ＋ ${fmt(pur)} － ${fmt(end)} ＝ ${fmt(ans)}円\n\n※売れた商品の元値（原価）を出すための基本公式です。`;
                let hint = `【ヒント】\n売上原価の公式は「期首 ＋ 当期仕入 － 期末」です。余計な情報に惑わされず、この3つを拾いましょう！`;
                return { text, ans, exp, hint };
            }
        ];

        // --- メイン処理 ---
        function startDrill() {
            const mode = document.getElementById('mode-select').value;
            if (mode === 'infinite') {
                isTestMode = false;
                document.getElementById('q-counter').innerText = '通常練習';
            } else {
                isTestMode = true;
                totalQuestions = parseInt(mode);
                currentQuestionNum = 1;
                correctCount = 0;
            }
            
            document.getElementById('settings-area').style.display = 'none';
            document.getElementById('test-result-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            
            nextQuestion(true);
        }

        function nextQuestion(isFirst = false) {
            if (isTestMode && !isFirst) {
                currentQuestionNum++;
                if (currentQuestionNum > totalQuestions) {
                    finishTest();
                    return;
                }
            }

            if (isTestMode) {
                document.getElementById('q-counter').innerText = `第 ${currentQuestionNum} / ${totalQuestions} 問`;
            }

            // UIリセット
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('calculator-area').style.display = 'block';
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('btn-hint').style.display = 'block';
            calcClear();

            // 問題生成
            const generator = questionGenerators[Math.floor(Math.random() * questionGenerators.length)];
            const q = generator();
            
            document.getElementById('question-text').innerText = q.text;
            currentAnswer = q.ans;
            document.getElementById('explanation-text').innerText = q.exp;
            currentHintText = q.hint;
        }

        function showHint() {
            document.getElementById('hint-box').innerText = currentHintText;
            document.getElementById('hint-box').style.display = 'block';
            document.getElementById('btn-hint').style.display = 'none';
        }

        function checkAnswer() {
            const inputVal = document.getElementById('calc-input').value;
            if (!inputVal) return;
            
            let userAns = 0;
            try {
                userAns = eval(inputVal.replace(/,/g, ''));
            } catch (e) {
                userAns = parseFloat(inputVal.replace(/,/g, ''));
            }

            const resultArea = document.getElementById('result-area');
            const judgeText = document.getElementById('judge-text');
            const calcArea = document.getElementById('calculator-area');

            calcArea.style.display = 'none';
            document.getElementById('btn-hint').style.display = 'none';
            document.getElementById('hint-box').style.display = 'none';
            resultArea.style.display = 'block';

            if (Math.abs(userAns - currentAnswer) <= 0.1) {
                judgeText.innerText = "⭕️ 正解！";
                resultArea.className = "correct";
                if (!isTestMode) {
                    streak++;
                    document.getElementById('streak-display').innerText = `連続正解: ${streak}`;
                } else {
                    correctCount++;
                }
            } else {
                judgeText.innerText = `❌ 残念... (あなたの回答: ${userAns} / 正解: ${currentAnswer})`;
                resultArea.className = "incorrect";
                if (!isTestMode) {
                    streak = 0;
                    document.getElementById('streak-display').innerText = `連続正解: ${streak}`;
                }
            }
        }

        function finishTest() {
            document.getElementById('game-area').style.display = 'none';
            const resultArea = document.getElementById('test-result-area');
            resultArea.style.display = 'block';
            
            const score = Math.round((correctCount / totalQuestions) * 100);
            document.getElementById('score-num').innerText = score;
            document.getElementById('correct-count-display').innerText = correctCount;
            document.getElementById('total-count-display').innerText = totalQuestions;

            const feedback = document.getElementById('test-feedback');
            if (score === 100) feedback.innerText = "完璧です！計数管理マスター！";
            else if (score >= 80) feedback.innerText = "素晴らしい成績です！実務でもバッチリですね。";
            else if (score >= 50) feedback.innerText = "あと一歩！引っかけ情報に惑わされないように注意！";
            else feedback.innerText = "まずは基礎の公式をしっかり復習しましょう！";
        }

        function returnToMenu() {
            document.getElementById('test-result-area').style.display = 'none';
            document.getElementById('settings-area').style.display = 'block';
            streak = 0;
            document.getElementById('streak-display').innerText = `連続正解: 0`;
        }

        // --- 電卓ロジック（カーソル対応） ---
        const calcInput = document.getElementById('calc-input');

        function calcAppend(val) {
            let start = calcInput.selectionStart;
            let end = calcInput.selectionEnd;
            let text = calcInput.value;
            calcInput.value = text.substring(0, start) + val + text.substring(end);
            let newPos = start + val.length;
            calcInput.setSelectionRange(newPos, newPos);
            calcInput.focus();
        }

        function calcBackspace() {
            let start = calcInput.selectionStart;
            let end = calcInput.selectionEnd;
            let text = calcInput.value;

            if (start === end && start > 0) {
                calcInput.value = text.substring(0, start - 1) + text.substring(end);
                calcInput.setSelectionRange(start - 1, start - 1);
            } else if (start !== end) {
                calcInput.value = text.substring(0, start) + text.substring(end);
                calcInput.setSelectionRange(start, start);
            }
            calcInput.focus();
        }

        function calcClear() {
            calcInput.value = "";
            calcInput.focus();
        }

        function calcEval() {
            try {
                let val = calcInput.value.replace(/×/g, '*').replace(/÷/g, '/');
                let res = Function('"use strict";return (' + val + ')')();
                calcInput.value = res;
                calcInput.setSelectionRange(calcInput.value.length, calcInput.value.length);
            } catch (e) {}
            calcInput.focus();
        }
    </script>
</body>
</html>
